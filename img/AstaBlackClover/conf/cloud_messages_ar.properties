# UTF-8. Verbatim message text from shinobimate_spiritual_messages_100.md.
message.1=اللهم صلِّ على سيدنا محمد عدد ما غفل عن ذكره الغافلون.
message.2=اللهم صلِّ وسلم على سيدنا محمد عدد خلقك ورضا نفسك.
message.3=اللهم صلِّ على سيدنا محمد النبي الأمي وعلى آله وسلم.
message.4=اللهم صلِّ وسلم على سيدنا محمد وعلى من تبعه بإحسان.
message.5=اللهم صلِّ وسلم وبارك على سيدنا محمد عدد أنفاس الخلائق.
message.6=الحمد لله.
message.7=سبحان الله عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته.
message.8=رب اغفر لي وتب علي إنك أنت التواب الرحيم.
message.9=سبحان من له الملك والملكوت.
message.10=يا رب لك الحمد حتى ترضى، ولك الحمد إذا رضيت.
message.11=اللهم ما أصبح بي من نعمة فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر.
message.12=اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي.
message.13=اللهم افتح لي في هذا الصباح أبواب رحمتك وتوفيقك.
message.14=يا رب أبعد عني في هذا اليوم الهم والحزن والضيق.
message.15=اللهم اجعل صباحنا صباحًا مباركًا بذكرك وشكرك.
message.16=ربنا لا تزغ قلوبنا بعد إذ هديتنا وهب لنا من لدنك رحمة.
message.17=حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم.
message.18=اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي.
message.19=اللهم اجعلني لك شاكرًا، لك ذاكرًا، إليك مخبتًا منيبًا.
message.20=اللهم اجعل القرآن ربيع قلوبنا ونور صدورنا وجلاء أحزاننا.
