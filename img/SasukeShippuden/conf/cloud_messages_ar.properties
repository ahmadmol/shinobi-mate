# UTF-8. Verbatim message text from shinobimate_spiritual_messages_100.md.
message.1=اللهم صلِّ على محمد وعلى آل محمد.
message.2=اللهم صلِّ على سيدنا محمد صلاةً تملأ القلب نورًا وسكينة.
message.3=اللهم صلِّ وسلم على سيدنا محمد في كل وقت وحين.
message.4=اللهم صلِّ على سيدنا محمد عدد ما في السماوات والأرض.
message.5=اللهم صلِّ وسلم على سيدنا محمد صلاةً تزيدنا حبًا واتباعًا.
message.6=سبحان الله العظيم.
message.7=أستغفر الله العظيم وأتوب إليه.
message.8=الله أكبر كبيرًا والحمد لله كثيرًا.
message.9=رضيت بالله ربًا وبالإسلام دينًا وبمحمد ﷺ نبيًا.
message.10=أستغفر الله الذي لا إله إلا هو الحي القيوم وأتوب إليه.
message.11=اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.
message.12=اللهم إني أسألك العفو والعافية في الدنيا والآخرة.
message.13=أعوذ بكلمات الله التامات من شر ما خلق.
message.14=يا رب ارزقني في هذا الصباح قلبًا مطمئنًا ولسانًا ذاكرًا.
message.15=اللهم ارزقني صباحًا يحمل الخير والرضا.
message.16=رب اشرح لي صدري ويسر لي أمري.
message.17=ربنا أفرغ علينا صبرًا وتوفنا مسلمين.
message.18=اللهم إني أسألك الهدى والتقى والعفاف والغنى.
message.19=اللهم إني أعوذ بك من العجز والكسل.
message.20=اللهم ارزقني راحة القلب وسكينة النفس.
