# UTF-8. Verbatim message text from shinobimate_spiritual_messages_100.md.
message.1=اللهم صلِّ على سيدنا محمد عدد ما ذكره الذاكرون.
message.2=اللهم صلِّ على سيدنا محمد ما تعاقب الليل والنهار.
message.3=اللهم صلِّ وسلم على سيدنا محمد صاحب الخلق العظيم.
message.4=اللهم صلِّ على سيدنا محمد واجزه عنا خير ما جزيت نبيًا عن أمته.
message.5=اللهم صلِّ وسلم على سيدنا محمد كلما صلى عليه المصلون.
message.6=الله أكبر.
message.7=سبحان الله والحمد لله ولا إله إلا الله والله أكبر.
message.8=يا حي يا قيوم برحمتك أستغيث.
message.9=لا إله إلا الله وحده لا شريك له، له الملك وله الحمد.
message.10=سبحان الله ملء السماوات وملء الأرض.
message.11=اللهم إني أعوذ بك من شر هذا اليوم وشر ما بعده.
message.12=اللهم استر عوراتي وآمن روعاتي.
message.13=يا رب اجعل صباحي هذا نورًا وطمأنينة وبركة.
message.14=اللهم اكتب لي في هذا الصباح رزقًا طيبًا واسعًا.
message.15=اللهم يسّر لي خير هذا اليوم واصرف عني شره.
message.16=رب إني لما أنزلت إلي من خير فقير.
message.17=ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين.
message.18=اللهم آت نفسي تقواها وزكها أنت خير من زكاها.
message.19=اللهم ارزقني حسن الخاتمة ورضاك.
message.20=اللهم ارزقنا من الخير فوق ما نرجو، واصرف عنا من الشر فوق ما نحذر.
