# UTF-8. Verbatim message text from shinobimate_spiritual_messages_100.md.
message.1=اللهم صلِّ وسلم وبارك على سيدنا محمد.
message.2=اللهم صلِّ وسلم على سيدنا محمد في الأولين والآخرين.
message.3=اللهم صلِّ على سيدنا محمد صلاةً دائمةً بدوام ملكك.
message.4=اللهم صلِّ وسلم على سيدنا محمد صلاةً مباركةً طيبة.
message.5=اللهم صلِّ على سيدنا محمد صلاةً تنير بها دروبنا.
message.6=سبحان الله وبحمده.
message.7=لا حول ولا قوة إلا بالله.
message.8=الحمد لله رب العالمين.
message.9=سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت.
message.10=الحمد لله على كل حال.
message.11=أصبحنا وأصبح الملك لله، والحمد لله.
message.12=اللهم إني أصبحت أشهدك وأشهد حملة عرشك أنك أنت الله لا إله إلا أنت.
message.13=بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.
message.14=اللهم اجعل هذا اليوم شاهد خير لي لا علي.
message.15=اللهم اجعل أول هذا اليوم صلاحًا وأوسطه فلاحًا وآخره نجاحًا.
message.16=ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.
message.17=ربنا اغفر لنا وارحمنا وأنت خير الراحمين.
message.18=اللهم اغفر لي وارحمني واهدني وعافني وارزقني.
message.19=اللهم إني أعوذ بك من الهم والحزن.
message.20=يا رب يسّر أمري واختر لي ما فيه الخير.
