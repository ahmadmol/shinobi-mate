# UTF-8. Verbatim message text from shinobimate_spiritual_messages_100.md.
message.1=اللهم صلِّ وسلم على نبينا محمد.
message.2=اللهم صلِّ وسلم على سيدنا محمد وعلى آله وصحبه أجمعين.
message.3=اللهم صلِّ على سيدنا محمد وعلى أزواجه وذريته.
message.4=اللهم صلِّ وسلم على سيدنا محمد ما دام ذكرك في القلوب.
message.5=اللهم صلِّ على سيدنا محمد وعلى آله الطيبين وصحبه أجمعين.
message.6=لا إله إلا الله.
message.7=حسبي الله ونعم الوكيل.
message.8=لا إله إلا أنت سبحانك إني كنت من الظالمين.
message.9=اللهم أعني على ذكرك وشكرك وحسن عبادتك.
message.10=اللهم لك الحمد كما ينبغي لجلال وجهك وعظيم سلطانك.
message.11=اللهم إني أسألك خير هذا اليوم وخير ما بعده.
message.12=اللهم إني أسألك العافية في ديني ودنياي وأهلي ومالي.
message.13=اللهم عالم الغيب والشهادة فاطر السماوات والأرض، رب كل شيء ومليكه، احفظني من الشر.
message.14=اللهم بارك لي في يومي ووقتي وعملي.
message.15=يا رب اجعل يومي عامرًا بطاعتك وذكرك.
message.16=رب زدني علمًا.
message.17=ربنا تقبل منا إنك أنت السميع العليم.
message.18=اللهم إنك عفو تحب العفو فاعف عني.
message.19=اللهم ارزقني قلبًا سليمًا ولسانًا صادقًا.
message.20=اللهم احفظ أهلي ومن أحب، وبارك لهم في أعمارهم وأرزاقهم.
